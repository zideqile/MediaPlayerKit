name: BinarySDKSample
options:
  deploymentTarget:
    iOS: "14.0"
targets:
  BinarySDKSample:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes: [README.md, project.yml]
    dependencies:
      - framework: ../SDK/MediaPlayerKit.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mpk.binarysample
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
