name: CI / Build, Test & Package Demo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (SDK & Demo)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Environment & Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift Package Dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package Dependencies
        run: swift package resolve

      - name: SPM Build (macOS Host)
        run: swift build -c release -v

      - name: Run SPM Unit Tests
        run: swift test -v

      - name: Build for iOS Simulator (xcodebuild)
        run: |
          xcodebuild build \
            -scheme MediaPlayerKit \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

  package-demo:
    name: Build & Sign Demo App (macOS & Signed iOS IPA)
    runs-on: macos-14
    needs: build-and-test
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'mpk123456' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Swift Package Dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Dependencies
        run: swift package resolve

      # 1. 编译并打包 macOS 独立桌面版 Demo App
      - name: Build macOS Demo App
        run: |
          mkdir -p build/macOS/MediaPlayerKitDemo.app/Contents/MacOS
          mkdir -p build/macOS/MediaPlayerKitDemo.app/Contents/Resources
          
          swift build -c release --product MediaPlayerKitDemo
          cp .build/release/MediaPlayerKitDemo build/macOS/MediaPlayerKitDemo.app/Contents/MacOS/
          
          cat << 'PLIST' > build/macOS/MediaPlayerKitDemo.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MediaPlayerKitDemo</string>
              <key>CFBundleIdentifier</key>
              <string>com.yuanyuanhui.MediaPlayerKitDemo</string>
              <key>CFBundleName</key>
              <string>MediaPlayerKit Demo</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PLIST
          
          codesign --force --deep --sign - build/macOS/MediaPlayerKitDemo.app
          cd build/macOS && zip -r ../MediaPlayerKitDemo-macOS.app.zip MediaPlayerKitDemo.app

      # 2. 使用 iPhoneOS SDK 编译真正的 iOS arm64 架构二进制并进行正式签名
      - name: Build & Sign iOS Demo App
        run: |
          echo "📱 正在使用 iPhoneOS SDK 编译 iOS arm64 架构二进制..."
          IPHONEOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # 使用 Swift 交叉编译指定 iPhoneOS SDK 与 arm64-apple-ios14.0 架构
          swift build -c release \
            --triple arm64-apple-ios14.0 \
            -Xswiftc -sdk -Xswiftc "$IPHONEOS_SDK" \
            -Xswiftc -target -Xswiftc arm64-apple-ios14.0 \
            --product MediaPlayerKitDemo
          
          # 寻找编译出的真实 iOS Mach-O 可执行文件
          IOS_BIN=$(find .build -name "MediaPlayerKitDemo" -path "*arm64-apple-ios*" -type f -perm +111 | head -n 1)
          if [ -z "$IOS_BIN" ]; then
            IOS_BIN=$(find .build -name "MediaPlayerKitDemo" -type f -perm +111 | grep -v "release/MediaPlayerKitDemo" | head -n 1)
          fi
          echo "找到 iOS 可执行文件: $IOS_BIN"
          file "$IOS_BIN"
          
          # 2) 创建标准 iOS App Bundle 结构
          mkdir -p build/iOS/MediaPlayerKitDemo.app
          cp "$IOS_BIN" build/iOS/MediaPlayerKitDemo.app/MediaPlayerKitDemo
          chmod +x build/iOS/MediaPlayerKitDemo.app/MediaPlayerKitDemo
          
          # 拷贝编译输出中的资源
          find .build -name "*.bundle" -exec cp -R {} build/iOS/MediaPlayerKitDemo.app/ \; || true
          find .build -name "*.metallib" -exec cp {} build/iOS/MediaPlayerKitDemo.app/ \; || true
          
          # 3) 生成符合 iOS 规范的完整 Info.plist
          cat << 'PLIST' > build/iOS/MediaPlayerKitDemo.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MediaPlayerKitDemo</string>
              <key>CFBundleIdentifier</key>
              <string>com.yuanyuanhui.MediaPlayerKitDemo</string>
              <key>CFBundleName</key>
              <string>MediaPlayerKitDemo</string>
              <key>CFBundleDisplayName</key>
              <string>MediaPlayerKit</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>DTPlatformName</key>
              <string>iphoneos</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PLIST
          
          # 4) 提取证书与描述文件的 Entitlements 并执行正式代码签名
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "🔐 检测到 Apple Developer 开发者证书与描述文件，开始配置钥匙串与签名..."
            
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            
            security list-keychains -d user -s $KEYCHAIN_PATH login.keychain
            security default-keychain -s $KEYCHAIN_PATH
            
            RAW_P12=$RUNNER_TEMP/build_certificate_raw.p12
            LEGACY_P12=$RUNNER_TEMP/build_certificate_legacy.p12
            PEM_TEMP=$RUNNER_TEMP/cert_temp.pem
            
            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $RAW_P12
            
            openssl pkcs12 -in $RAW_P12 -passin pass:"$P12_PASSWORD" -nodes -out $PEM_TEMP
            openssl pkcs12 -export -in $PEM_TEMP -out $LEGACY_P12 -passout pass:"$P12_PASSWORD"
            security import $LEGACY_P12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            
            # 安装描述文件并提取真实 Entitlements
            PP_PATH=~/Library/MobileDevice/Provisioning\ Profiles
            mkdir -p "$PP_PATH"
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH/profile.mobileprovision"
            cp "$PP_PATH/profile.mobileprovision" build/iOS/MediaPlayerKitDemo.app/embedded.mobileprovision
            
            python3 -c "
            import plistlib, re
            with open('$PP_PATH/profile.mobileprovision', 'rb') as f:
                content = f.read()
            match = re.search(rb'<\?xml.*?</plist>', content, re.DOTALL)
            if match:
                data = plistlib.loads(match.group(0))
                entitlements = data.get('Entitlements', {})
                with open('build/iOS/entitlements.plist', 'wb') as out:
                    plistlib.dump(entitlements, out)
                print('已提取 Entitlements:', entitlements)
            "
            
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "iPhone Developer" | head -1 | awk -F '"' '{print $2}')
            echo "Using Signing Identity: $SIGNING_IDENTITY"
            
            if [ -n "$SIGNING_IDENTITY" ]; then
              codesign --force --deep --sign "$SIGNING_IDENTITY" --entitlements build/iOS/entitlements.plist --timestamp=none build/iOS/MediaPlayerKitDemo.app
              echo "✅ iOS App 签名完成！"
              codesign -dvvv build/iOS/MediaPlayerKitDemo.app
            fi
            
            security delete-keychain $KEYCHAIN_PATH || true
          fi
          
          # 5) 打包为标准 Payload 结构的 IPA 真机安装包
          cd build/iOS
          mkdir -p Payload
          cp -R MediaPlayerKitDemo.app Payload/
          zip -qr ../MediaPlayerKitDemo-iOS.ipa Payload
          echo "IPA 打包完成，文件大小:"
          ls -lh ../MediaPlayerKitDemo-iOS.ipa

      # 3. 上传构建产物到 GitHub Actions Artifacts
      - name: Upload macOS Demo App
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerKitDemo-macOS
          path: build/MediaPlayerKitDemo-macOS.app.zip

      - name: Upload iOS Demo App (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerKitDemo-iOS
          path: build/MediaPlayerKitDemo-iOS.ipa
