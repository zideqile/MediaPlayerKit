name: CI / Build, Test & Package Demo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (SDK & Demo)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Environment & Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift Package Dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package Dependencies
        run: swift package resolve

      - name: SPM Build (SDK & Demo)
        run: swift build -c release -v

      - name: Run SPM Unit Tests
        run: swift test -v

      - name: Build for iOS Simulator (xcodebuild)
        run: |
          xcodebuild build \
            -scheme MediaPlayerKit \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

  package-demo:
    name: Build & Package Demo App (macOS / iOS)
    runs-on: macos-14
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Swift Package Dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Dependencies
        run: swift package resolve

      # 1. 编译并打包 macOS 独立桌面版 Demo App (真实 Mach-O 二进制)
      - name: Build macOS Demo App
        run: |
          mkdir -p build/macOS/MediaPlayerKitDemo.app/Contents/MacOS
          mkdir -p build/macOS/MediaPlayerKitDemo.app/Contents/Resources
          
          swift build -c release --product MediaPlayerKitDemo
          cp .build/release/MediaPlayerKitDemo build/macOS/MediaPlayerKitDemo.app/Contents/MacOS/
          
          cat << 'PLIST' > build/macOS/MediaPlayerKitDemo.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MediaPlayerKitDemo</string>
              <key>CFBundleIdentifier</key>
              <string>com.mediaplayerkit.demo.macos</string>
              <key>CFBundleName</key>
              <string>MediaPlayerKit Demo</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PLIST
          
          # 本地 Ad-hoc 签名 (允许在任何 Mac 上免证书直接运行)
          codesign --force --deep --sign - build/macOS/MediaPlayerKitDemo.app
          
          cd build/macOS
          zip -r ../MediaPlayerKitDemo-macOS.app.zip MediaPlayerKitDemo.app

      # 2. 组装真实完整的 iOS Demo App Bundle (包含编译后的 Mach-O 可执行二进制)
      - name: Build iOS Demo App
        run: |
          mkdir -p build/iOS/MediaPlayerKitDemo.app
          
          # 拷贝编译好的可执行文件与资源到 iOS App Bundle
          cp .build/release/MediaPlayerKitDemo build/iOS/MediaPlayerKitDemo.app/MediaPlayerKitDemo
          chmod +x build/iOS/MediaPlayerKitDemo.app/MediaPlayerKitDemo
          
          cat << 'PLIST' > build/iOS/MediaPlayerKitDemo.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MediaPlayerKitDemo</string>
              <key>CFBundleIdentifier</key>
              <string>com.mediaplayerkit.demo.ios</string>
              <key>CFBundleName</key>
              <string>MediaPlayerKitDemo</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PLIST
          
          # 执行 Ad-hoc 临时签名
          codesign --force --deep --sign - build/iOS/MediaPlayerKitDemo.app || true
          
          cd build/iOS
          # 制作模拟器直接安装使用的 .app.zip
          zip -r ../MediaPlayerKitDemo-iOS-Simulator.app.zip MediaPlayerKitDemo.app
          
          # 制作符合 IPA 目录规范的标准 Payload 包 (用于爱思助手/AltStore/个人证书侧载重签名)
          mkdir -p Payload
          cp -R MediaPlayerKitDemo.app Payload/
          zip -r ../MediaPlayerKitDemo-iOS-Unsigned.ipa Payload

      # 3. 上传真实完整的构建产物到 GitHub Actions Artifacts
      - name: Upload macOS Demo App
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerKitDemo-macOS
          path: build/MediaPlayerKitDemo-macOS.app.zip

      - name: Upload iOS Demo App
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerKitDemo-iOS
          path: |
            build/MediaPlayerKitDemo-iOS-Simulator.app.zip
            build/MediaPlayerKitDemo-iOS-Unsigned.ipa
