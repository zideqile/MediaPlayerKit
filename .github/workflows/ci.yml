name: CI / Build, Test & Package Demo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build, Test & Sign iOS Demo IPA
    runs-on: macos-latest
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: mpk123456
      VPLAYER_LOG_DOMAIN: ${{ vars.VPLAYER_LOG_DOMAIN || vars.LOG_SERVER_DOMAIN || vars.LOG_DOMAIN || secrets.VPLAYER_LOG_DOMAIN || secrets.LOG_SERVER_DOMAIN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Environment & Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Cache Swift Package Dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package Dependencies
        run: swift package resolve

      - name: SPM Build & Test (macOS Host)
        run: |
          swift build -c release -v
          swift test -v

      # 1. 生成原生 iOS 工程并用 Xcode 归档编译真实 iOS 应用包
      - name: Build & Sign iOS Demo App
        run: |
          echo "🔨 生成标准 Xcode iOS 工程..."
          xcodegen generate
          
          # 修正 Xcode 15/16 项目兼容性 objectVersion
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' MediaPlayerKitDemo.xcodeproj/project.pbxproj
          sed -i '' 's/compatibilityVersion = "Xcode 16.0";/compatibilityVersion = "Xcode 14.0";/g' MediaPlayerKitDemo.xcodeproj/project.pbxproj
          
          echo "📱 使用 Xcode 归档编译 iOS arm64 原生应用..."
          xcodebuild archive \
            -project MediaPlayerKitDemo.xcodeproj \
            -scheme MediaPlayerKitDemo \
            -destination "generic/platform=iOS" \
            -archivePath build/MediaPlayerKitDemo-iOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          APP_DIR="build/MediaPlayerKitDemo-iOS.xcarchive/Products/Applications/MediaPlayerKitDemo.app"
          echo "iOS App Bundle 路径: $APP_DIR"
          
          # 显式编译 LaunchScreen.storyboard 为 storyboardc 资源（失败即终止，确保启动屏二进制资源必须存在）
          echo "🎨 编译 LaunchScreen.storyboard..."
          ibtool --compile "$APP_DIR/LaunchScreen.storyboardc" Examples/MediaPlayerKitDemo/Base.lproj/LaunchScreen.storyboard
          mkdir -p "$APP_DIR/Base.lproj"
          ibtool --compile "$APP_DIR/Base.lproj/LaunchScreen.storyboardc" Examples/MediaPlayerKitDemo/Base.lproj/LaunchScreen.storyboard
          
          # 校验启动屏编译产物是否存在
          test -d "$APP_DIR/LaunchScreen.storyboardc" || (echo "❌ 致命错误: LaunchScreen.storyboardc 未生成！" && exit 1)
          test -d "$APP_DIR/Base.lproj/LaunchScreen.storyboardc" || (echo "❌ 致命错误: Base.lproj/LaunchScreen.storyboardc 未生成！" && exit 1)
          echo "✅ 启动屏 Storyboard 二进制产物已成功生成并校验通过"
          
          # 注入全屏与启动配置 (彻底杜绝 iOS Letterboxing 兼容黑边)
          echo "📱 注入 iOS 全面屏配置 (UIRequiresFullScreen = true, UILaunchStoryboardName = LaunchScreen)..."
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen bool true" "$APP_DIR/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName string LaunchScreen" "$APP_DIR/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string LaunchScreen" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :LSRequiresIPhoneOS bool true" "$APP_DIR/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :LSRequiresIPhoneOS bool true" "$APP_DIR/Info.plist"
          
          ls -la "$APP_DIR"
          ls -la "$APP_DIR/Base.lproj"
          
          # 注入 App Transport Security 允许 HTTP 明文网络访问 (解决 ATS 阻拦 HTTP 节点请求问题)
          echo "🌐 配置 App Transport Security (NSAllowsArbitraryLoads = true)..."
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$APP_DIR/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$APP_DIR/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent bool true" "$APP_DIR/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent bool true" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$APP_DIR/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$APP_DIR/Info.plist"
          
          # 注入旧版日志上报服务器域名 (如果配置了 GitHub Actions 变量或密钥)
          if [ -n "$VPLAYER_LOG_DOMAIN" ]; then
            echo "📡 注入日志上报域名至 Info.plist..."
            /usr/libexec/PlistBuddy -c "Set :VPlayerLogDomain string $VPLAYER_LOG_DOMAIN" "$APP_DIR/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :VPlayerLogDomain string $VPLAYER_LOG_DOMAIN" "$APP_DIR/Info.plist"
          fi
          
          plutil -p "$APP_DIR/Info.plist" || true

          # 2. 提取证书与描述文件执行正式代码签名
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "🔐 开始配置钥匙串与正式证书签名..."
            
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            
            security list-keychains -d user -s $KEYCHAIN_PATH login.keychain
            security default-keychain -s $KEYCHAIN_PATH
            
            RAW_P12=$RUNNER_TEMP/build_certificate_raw.p12
            LEGACY_P12=$RUNNER_TEMP/build_certificate_legacy.p12
            PEM_TEMP=$RUNNER_TEMP/cert_temp.pem
            
            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $RAW_P12
            
            openssl pkcs12 -in $RAW_P12 -passin pass:"$P12_PASSWORD" -nodes -out $PEM_TEMP
            openssl pkcs12 -export -in $PEM_TEMP -out $LEGACY_P12 -passout pass:"$P12_PASSWORD"
            security import $LEGACY_P12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            
            # 安装描述文件并提取真实 Entitlements
            PP_PATH=~/Library/MobileDevice/Provisioning\ Profiles
            mkdir -p "$PP_PATH"
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH/profile.mobileprovision"
            cp "$PP_PATH/profile.mobileprovision" "$APP_DIR/embedded.mobileprovision"
            
            python3 -c "
            import plistlib, re
            with open('$PP_PATH/profile.mobileprovision', 'rb') as f:
                content = f.read()
            match = re.search(rb'<\?xml.*?</plist>', content, re.DOTALL)
            if match:
                data = plistlib.loads(match.group(0))
                entitlements = data.get('Entitlements', {})
                with open('build/entitlements.plist', 'wb') as out:
                    plistlib.dump(entitlements, out)
                print('已提取 Entitlements:', entitlements)
            "
            
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -E "iPhone Distribution|Apple Distribution|iPhone Developer|Apple Development" | head -1 | awk -F '"' '{print $2}')
            echo "Using Signing Identity: $SIGNING_IDENTITY"
            
            # 签名 App 内部的所有 Frameworks (如果有)
            if [ -d "$APP_DIR/Frameworks" ]; then
              for f in "$APP_DIR"/Frameworks/*; do
                codesign --force --sign "$SIGNING_IDENTITY" --timestamp=none "$f" || true
              done
            fi
            
            # 签名主程序 Bundle
            codesign --force --deep --sign "$SIGNING_IDENTITY" --entitlements build/entitlements.plist --timestamp=none "$APP_DIR"
            echo "✅ iOS App 签名完成！"
            codesign -dvvv "$APP_DIR"
            
            security delete-keychain $KEYCHAIN_PATH || true
          fi
          
          # 3. 打包为标准 Payload 结构的 IPA 真机安装包
          mkdir -p build/iOS/Payload
          cp -R "$APP_DIR" build/iOS/Payload/
          cd build/iOS
          zip -qr ../MediaPlayerKitDemo-iOS.ipa Payload
          echo "IPA 打包完成，文件大小:"
          ls -lh ../MediaPlayerKitDemo-iOS.ipa

      # 4. 上传构建产物到 GitHub Actions Artifacts
      - name: Upload iOS Demo App (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerKitDemo-iOS
          path: build/MediaPlayerKitDemo-iOS.ipa

      # 5. 自动上传 IPA 到远程分发服务器 (通过 GitHub Actions 变量/密钥配置地址)
      - name: Upload IPA to Remote Distribution Server
        env:
          IOS_APP_UPLOAD_URL: ${{ vars.IOS_APP_UPLOAD_URL }}
          IPA_UPLOAD_URL: ${{ vars.IPA_UPLOAD_URL }}
          UPLOAD_URL: ${{ vars.UPLOAD_URL }}
          APP_UPLOAD_URL: ${{ vars.APP_UPLOAD_URL }}
          SECRET_IOS_APP_UPLOAD_URL: ${{ secrets.IOS_APP_UPLOAD_URL }}
          SECRET_IPA_UPLOAD_URL: ${{ secrets.IPA_UPLOAD_URL }}
          SECRET_UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          SECRET_APP_UPLOAD_URL: ${{ secrets.APP_UPLOAD_URL }}
        run: |
          TARGET_URL="${IOS_APP_UPLOAD_URL:-${IPA_UPLOAD_URL:-${UPLOAD_URL:-${APP_UPLOAD_URL:-${SECRET_IOS_APP_UPLOAD_URL:-${SECRET_IPA_UPLOAD_URL:-${SECRET_UPLOAD_URL:-${SECRET_APP_UPLOAD_URL}}}}}}}}"
          if [ -z "$TARGET_URL" ]; then
            echo "⚠️ [警告] 未检测到远程分发上传地址变量！"
            echo "请前往 GitHub 仓库 -> Settings -> Secrets and variables -> Actions"
            echo "在 Variables 或 Secrets 中添加变量名: IOS_APP_UPLOAD_URL"
            echo "由于未配置该变量，本次跳过自动上传步骤。"
            exit 0
          fi

          if [ ! -f "build/MediaPlayerKitDemo-iOS.ipa" ]; then
            echo "::error::未找到构建产物 build/MediaPlayerKitDemo-iOS.ipa，无法上传！"
            exit 1
          fi

          echo "🚀 开始上传 MediaPlayerKitDemo-iOS.ipa 到分发服务器..."
          HTTP_RESPONSE=$(curl -s --connect-timeout 30 --retry 3 --retry-delay 2 -w "\n%{http_code}" -X POST "$TARGET_URL" -F "file=@build/MediaPlayerKitDemo-iOS.ipa")
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')

          echo "服务器响应内容: $RESPONSE_BODY"
          echo "HTTP 响应状态码: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "🎉 IPA 文件上传成功！"
          else
            echo "::error::IPA 文件上传失败，HTTP 状态码: $HTTP_STATUS"
            exit 1
          fi

