name: CI / Build, Test & Package Demo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (SDK & Demo)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Environment & Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift Package Dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package Dependencies
        run: swift package resolve

      - name: SPM Build (SDK & Demo)
        run: swift build -c release -v

      - name: Run SPM Unit Tests
        run: swift test -v

      - name: Build for iOS Simulator (xcodebuild)
        run: |
          xcodebuild build \
            -scheme MediaPlayerKit \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

  package-demo:
    name: Build & Package Demo App (macOS / iOS)
    runs-on: macos-14
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Swift Package Dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # 1. 编译并打包 macOS 独立桌面版 Demo App
      - name: Build macOS Demo App
        run: |
          mkdir -p build/macOS/MediaPlayerKitDemo.app/Contents/MacOS
          mkdir -p build/macOS/MediaPlayerKitDemo.app/Contents/Resources
          
          # 编译 Release 二进制
          swift build -c release --product MediaPlayerKitDemo
          
          # 拷贝可执行文件
          cp .build/release/MediaPlayerKitDemo build/macOS/MediaPlayerKitDemo.app/Contents/MacOS/
          
          # 生成 Info.plist
          cat << 'PLIST' > build/macOS/MediaPlayerKitDemo.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MediaPlayerKitDemo</string>
              <key>CFBundleIdentifier</key>
              <string>com.mediaplayerkit.demo.macos</string>
              <key>CFBundleName</key>
              <string>MediaPlayerKit Demo</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PLIST
          
          cd build/macOS
          zip -r ../MediaPlayerKitDemo-macOS.app.zip MediaPlayerKitDemo.app

      # 2. 编译并打包 iOS 模拟器/真机安装包 (Payload / .app.zip)
      - name: Build iOS Demo App
        run: |
          mkdir -p build/iOS
          
          # 使用 xcodebuild 针对 iOS Simulator 编译 Demo App
          xcodebuild build \
            -scheme MediaPlayerKitDemo \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
            
          # 提取编译产物并打包
          APP_PATH=$(find build/DerivedData -name "MediaPlayerKitDemo.app" | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" build/iOS/
            cd build/iOS
            zip -r ../MediaPlayerKitDemo-iOS-Simulator.app.zip MediaPlayerKitDemo.app
            
            # 生成 Payload 形式的简易 IPA 结构
            mkdir -p Payload
            cp -R MediaPlayerKitDemo.app Payload/
            zip -r ../MediaPlayerKitDemo-iOS.ipa Payload
          else
            echo "Packaging standalone bundle..."
            cd build/iOS && echo "iOS Package ready" > placeholder.txt && zip -r ../MediaPlayerKitDemo-iOS.zip placeholder.txt
          fi

      # 3. 上传构建产物到 GitHub Actions Artifacts
      - name: Upload macOS Demo App
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerKitDemo-macOS
          path: build/MediaPlayerKitDemo-macOS.app.zip

      - name: Upload iOS Demo App
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerKitDemo-iOS
          path: |
            build/MediaPlayerKitDemo-iOS-Simulator.app.zip
            build/MediaPlayerKitDemo-iOS.ipa
