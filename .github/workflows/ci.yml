name: CI / Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (iOS / SPM)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Environment & Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift Package Dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package Dependencies
        run: swift package resolve

      - name: SPM Build for macOS/Host
        run: swift build -v

      - name: Run SPM Unit Tests
        run: swift test -v

      - name: Build for iOS Simulator (xcodebuild)
        run: |
          xcodebuild build \
            -scheme MediaPlayerKit \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
