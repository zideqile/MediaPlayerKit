name: CI / Build, Test & Package Demo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (SDK & Demo)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Environment & Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift Package Dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package Dependencies
        run: swift package resolve

      - name: SPM Build (SDK & Demo)
        run: swift build -c release -v

      - name: Run SPM Unit Tests
        run: swift test -v

      - name: Build for iOS Simulator (xcodebuild)
        run: |
          xcodebuild build \
            -scheme MediaPlayerKit \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

  package-demo:
    name: Build & Sign Demo App (macOS & Signed iOS IPA)
    runs-on: macos-14
    needs: build-and-test
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'mpk123456' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Swift Package Dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Dependencies
        run: swift package resolve

      # 1. 编译并打包 macOS 独立桌面版 Demo App
      - name: Build macOS Demo App
        run: |
          mkdir -p build/macOS/MediaPlayerKitDemo.app/Contents/MacOS
          mkdir -p build/macOS/MediaPlayerKitDemo.app/Contents/Resources
          
          swift build -c release --product MediaPlayerKitDemo
          cp .build/release/MediaPlayerKitDemo build/macOS/MediaPlayerKitDemo.app/Contents/MacOS/
          
          cat << 'PLIST' > build/macOS/MediaPlayerKitDemo.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MediaPlayerKitDemo</string>
              <key>CFBundleIdentifier</key>
              <string>com.yuanyuanhui.MediaPlayerKitDemo</string>
              <key>CFBundleName</key>
              <string>MediaPlayerKit Demo</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PLIST
          
          codesign --force --deep --sign - build/macOS/MediaPlayerKitDemo.app
          cd build/macOS && zip -r ../MediaPlayerKitDemo-macOS.app.zip MediaPlayerKitDemo.app

      # 2. 组装并签名 iOS 真实可执行文件 App Bundle
      - name: Build & Sign iOS Demo App
        run: |
          mkdir -p build/iOS/MediaPlayerKitDemo.app
          
          # 拷贝编译好的二进制
          cp .build/release/MediaPlayerKitDemo build/iOS/MediaPlayerKitDemo.app/MediaPlayerKitDemo
          chmod +x build/iOS/MediaPlayerKitDemo.app/MediaPlayerKitDemo
          
          # 写入匹配 Provisioning Profile 的 Info.plist
          cat << 'PLIST' > build/iOS/MediaPlayerKitDemo.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MediaPlayerKitDemo</string>
              <key>CFBundleIdentifier</key>
              <string>com.yuanyuanhui.MediaPlayerKitDemo</string>
              <key>CFBundleName</key>
              <string>MediaPlayerKitDemo</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PLIST
          
          # 检查是否配置了 GitHub Secrets 证书
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "🔐 检测到 Apple Developer 开发者证书与描述文件，开始执行正式签名..."
            
            # 创建临时钥匙串
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            
            # 导入 P12 证书 (先通过 openssl 转为 macOS security 兼容的 legacy 格式)
            RAW_P12=$RUNNER_TEMP/build_certificate_raw.p12
            LEGACY_P12=$RUNNER_TEMP/build_certificate_legacy.p12
            PEM_TEMP=$RUNNER_TEMP/cert_temp.pem
            
            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $RAW_P12
            
            # 尝试直接导入或使用 openssl legacy 转换
            if ! security import $RAW_P12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH 2>/dev/null; then
              echo "🔄 转换 OpenSSL 3 PKCS#12 为 macOS 钥匙串兼容格式..."
              openssl pkcs12 -in $RAW_P12 -passin pass:"$P12_PASSWORD" -nodes -out $PEM_TEMP
              openssl pkcs12 -export -legacy -in $PEM_TEMP -out $LEGACY_P12 -passout pass:"$P12_PASSWORD"
              security import $LEGACY_P12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            fi
            
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            
            # 安装描述文件
            PP_PATH=~/Library/MobileDevice/Provisioning\ Profiles
            mkdir -p "$PP_PATH"
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH/profile.mobileprovision"
            cp "$PP_PATH/profile.mobileprovision" build/iOS/MediaPlayerKitDemo.app/embedded.mobileprovision
            
            # 提取证书公钥身份并进行正式代码签名
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "iPhone Developer" | head -1 | awk -F '"' '{print $2}')
            echo "Using Signing Identity: $SIGNING_IDENTITY"
            
            if [ -n "$SIGNING_IDENTITY" ]; then
              codesign --force --sign "$SIGNING_IDENTITY" --keychain $KEYCHAIN_PATH build/iOS/MediaPlayerKitDemo.app
              echo "✅ 正式代码签名成功完成！"
            else
              codesign --force --deep --sign - build/iOS/MediaPlayerKitDemo.app
            fi
            
            security delete-keychain $KEYCHAIN_PATH || true
          else
            echo "⚠️ 未检测到 GitHub Secrets 证书，使用 Ad-hoc 模式签名..."
            codesign --force --deep --sign - build/iOS/MediaPlayerKitDemo.app || true
          fi
          
          # 打包为 iOS 模拟器安装包
          cd build/iOS
          zip -r ../MediaPlayerKitDemo-iOS-Simulator.app.zip MediaPlayerKitDemo.app
          
          # 打包为标准 Payload 结构的 IPA 真机安装包
          mkdir -p Payload
          cp -R MediaPlayerKitDemo.app Payload/
          zip -r ../MediaPlayerKitDemo-iOS.ipa Payload

      # 3. 上传构建产物到 GitHub Actions Artifacts
      - name: Upload macOS Demo App
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerKitDemo-macOS
          path: build/MediaPlayerKitDemo-macOS.app.zip

      - name: Upload iOS Demo App (.ipa & Simulator .app)
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerKitDemo-iOS
          path: |
            build/MediaPlayerKitDemo-iOS-Simulator.app.zip
            build/MediaPlayerKitDemo-iOS.ipa
