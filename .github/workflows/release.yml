name: Build & Release iOS Binary SDK & Demo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build iOS SDK then Binary Demo
    runs-on: macos-14

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling dependencies
        run: python3 -m pip install PyYAML==6.0.2

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and generate version metadata
        env:
          VERSION_BUILD_NUMBER: ${{ github.run_number }}
          VERSION_COMMIT: ${{ github.sha }}
          VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python3 scripts/generate_versions.py --check
          args=(--build-number "$VERSION_BUILD_NUMBER" --commit "$VERSION_COMMIT" --manifest build/version-manifest.json)
          if [ -n "$VERSION_TAG" ]; then
            args+=(--release-tag "$VERSION_TAG")
          fi
          python3 scripts/generate_versions.py "${args[@]}"

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Build SDK binary and dependencies
        env:
          MPK_VERSION_MANIFEST: build/version-manifest.json
          SDK_BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build_binary_delivery.sh "$SDK_BUILD_NUMBER"

      - name: Build iOS Demo from the generated binary
        run: |
          python3 scripts/generate_demo_project.py --mode binary --platform simulator
          xcodegen generate --spec project.generated.yml
          xcodebuild build \
            -project MediaPlayerKitDemoBinary.xcodeproj \
            -scheme MediaPlayerKitDemo \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DemoConsumerDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p build/iOS
          cp -R build/DemoConsumerDerivedData/Build/Products/Release-iphonesimulator/MediaPlayerKitDemo.app build/iOS/
          cd build/iOS
          zip -r ../MediaPlayerKitDemo-iOS-Simulator.app.zip MediaPlayerKitDemo.app

      - name: Package binary delivery candidate
        run: |
          cd build/binary-delivery
          zip -r ../MediaPlayerKit-Binary-Candidate.zip SDK Docs Sample Licenses Audit README.md Package.resolved version-manifest.json SHA256SUMS CANDIDATE.txt

      # 4. 上传 Artifact
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-Artifacts-${{ github.run_number }}-${{ github.sha }}
          path: |
            build/version-manifest.json
            build/MediaPlayerKit-Binary-Candidate.zip
            build/MediaPlayerKitDemo-iOS-Simulator.app.zip

      # 5. 发布 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/version-manifest.json
            build/MediaPlayerKit-Binary-Candidate.zip
            build/MediaPlayerKitDemo-iOS-Simulator.app.zip
          generate_release_notes: true
