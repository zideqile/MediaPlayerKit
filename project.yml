name: MediaPlayerKitDemo
options:
  bundleIdPrefix: com.yuanyuanhui
  xcodeVersion: "15.0"
  defaultConfig: Release
  deploymentTarget:
    iOS: "14.0"
    macOS: "11.0"
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    from: 2.3.4
targets:
  MediaPlayerKit:
    type: framework
    platform: iOS
    deploymentTarget: "14.0"
    sources: 
      - path: Sources/MediaPlayerKit
    dependencies:
      - package: KSPlayer
        product: KSPlayer
    preBuildScripts:
      - name: Stamp local build version
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CI:-}" != "true" ]; then
            python3 "$SRCROOT/scripts/generate_versions.py" --build
          fi
    info:
      path: Sources/MediaPlayerKit/Info.plist
    configFiles:
      Debug: Config/Versions.xcconfig
      Release: Config/Versions.xcconfig
    settings:
      base:
        MARKETING_VERSION: "$(MPK_SDK_VERSION)"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: MediaPlayerKit
        PRODUCT_BUNDLE_IDENTIFIER: com.yuanyuanhui.MediaPlayerKit
        SWIFT_VERSION: "5.9"
        ENABLE_BITCODE: NO

  MediaPlayerKitDemo:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Examples/MediaPlayerKitDemo
    dependencies:
      - target: MediaPlayerKit
    info:
      path: Examples/MediaPlayerKitDemo/Info.plist
    configFiles:
      Debug: Config/Versions.xcconfig
      Release: Config/Versions.xcconfig
    settings:
      base:
        MARKETING_VERSION: "$(MPK_DEMO_VERSION)"
        PRODUCT_NAME: MediaPlayerKitDemo
        PRODUCT_BUNDLE_IDENTIFIER: com.yuanyuanhui.MediaPlayerKitDemo
        DEVELOPMENT_TEAM: GB8FE8WWF8
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.9"
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Examples/MediaPlayerKitDemo/Info.plist
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        TARGETED_DEVICE_FAMILY: "1"
