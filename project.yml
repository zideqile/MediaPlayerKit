name: MediaPlayerKitDemo
options:
  bundleIdPrefix: com.yuanyuanhui
  xcodeVersion: "15.0"
  defaultConfig: Release
  deploymentTarget:
    iOS: "14.0"
    macOS: "11.0"
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    from: 2.3.4
targets:
  MediaPlayerKitDemo:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/MediaPlayerKit
      - path: Examples/MediaPlayerKitDemo
    dependencies:
      - package: KSPlayer
        product: KSPlayer
    info:
      path: Examples/MediaPlayerKitDemo/Info.plist
      properties:
        CFBundleDisplayName: "MediaPlayerKit"
        CFBundleIdentifier: "com.yuanyuanhui.MediaPlayerKitDemo"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIDeviceFamily: [1, 2]
        UIRequiredDeviceCapabilities: ["arm64"]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_NAME: MediaPlayerKitDemo
        PRODUCT_BUNDLE_IDENTIFIER: com.yuanyuanhui.MediaPlayerKitDemo
        DEVELOPMENT_TEAM: GB8FE8WWF8
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.9"
        ENABLE_BITCODE: NO
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
